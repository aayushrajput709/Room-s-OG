<title>RoomKhoj</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-style app shell, sticky top bar, four-tab bottom nav, bottom sheets, glass loader between tabs */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#1D2630; --muted:#5F6B7A; --line:#E6EBF2;
  --primary:#4680FF; --on-primary:#FFFFFF; --accent:#FF9F0A; --on-accent:#2A1B00;
  --chip:#EAF0FA; --good:#1B7A52; --good-bg:#DDF1E7; --danger:#B3261E; --danger-bg:#F9E1DE;
  --glass-a:rgba(255,255,255,.78); --glass-b:rgba(255,255,255,.3); --glass-edge:rgba(255,255,255,.9); --glass-fill:rgba(255,255,255,.5);
  --shadow:0 1px 2px rgba(16,28,39,.05),0 8px 22px rgba(16,28,39,.07);
  --font-display:'Public Sans','Bricolage Grotesque','Noto Sans Devanagari','Figtree',system-ui,sans-serif;
  --font-body:'Public Sans','Figtree','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --surface:#16202A; --ink:#E9EEF2; --muted:#9AA8B3; --line:#25323D;
  --primary:#9CCBF0; --on-primary:#0A1C2B; --chip:#1F2C37;
  --good:#6FD3A3; --good-bg:#16352A; --danger:#FF9C93; --danger-bg:#3A1C19;
  --glass-a:rgba(255,255,255,.24); --glass-b:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.32); --glass-fill:rgba(156,203,240,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --surface:#16202A; --ink:#E9EEF2; --muted:#9AA8B3; --line:#25323D;
  --primary:#9CCBF0; --on-primary:#0A1C2B; --chip:#1F2C37;
  --good:#6FD3A3; --good-bg:#16352A; --danger:#FF9C93; --danger-bg:#3A1C19;
  --glass-a:rgba(255,255,255,.24); --glass-b:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.32); --glass-fill:rgba(156,203,240,.18);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;padding-bottom:112px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.mark{width:28px;height:28px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.mark .ic{width:16px;height:16px;stroke-width:2.2}
.langseg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex:none}
.langseg button{padding:4px 9px;border-radius:7px;font-weight:700;font-size:12px;color:var(--muted);min-width:34px}
.langseg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* shared */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:38px}
textarea.in{min-height:72px;resize:vertical}
.err{color:var(--danger);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 15px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-weight:700;text-decoration:none}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--danger-bg);color:var(--danger)}
.sec-title{font-size:21px;letter-spacing:-.02em;line-height:1.15;margin:4px 0 4px}
.sec-sub{margin:0 0 12px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipw{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip.on,.chip:has(input:checked){background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}

/* home */
.hero-h{padding:2px 0 10px}
.hero-h h1{font-size:23px;line-height:1.1;letter-spacing:-.03em}
.hero-h p{margin:5px 0 9px;color:var(--muted)}
.areachip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600}
.areachip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.areachip .ic{width:14px;height:14px;color:var(--primary)}
.searchrow{display:flex;gap:8px;margin:0 0 10px}
.search{position:relative;flex:1;min-width:0}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .in{padding-left:36px}
.fbtn{position:relative;width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.fbtn b{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.meta .cnt{font-weight:700}
.meta select{border:0;background:none;font-weight:600;color:var(--primary);max-width:58%}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.ph{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:700;
  background:linear-gradient(135deg,hsl(var(--h) 38% 40%),hsl(calc(var(--h) + 30) 44% 27%))}
.tile .ic{width:26px;height:26px;opacity:.9}
.fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#3a4650;display:grid;place-items:center}
.fav.on{color:#D92D4A}.fav.on .ic{fill:currentColor}
.badge{position:absolute;left:8px;bottom:8px;background:rgba(10,20,30,.78);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;display:flex;gap:5px;align-items:center}
.badge .ic{width:12px;height:12px}
.cb{padding:10px 13px 12px;display:flex;flex-direction:column;gap:3px}
.price{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price small{font:600 11px var(--font-body);color:var(--muted);letter-spacing:0}
.card h3{font-size:14px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
.loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin:0}
.loc .ic{width:13px;height:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--chip)}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.note{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--chip);margin-top:16px}

/* add form */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photos{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hidefile{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
button.pbox{font:inherit;color:var(--muted)}
.pbox{width:68px;height:68px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);position:relative;overflow:hidden;background:var(--surface);cursor:pointer;font-size:12px;text-align:center;align-content:center;gap:2px}
.pbox img{width:100%;height:100%;object-fit:cover}
.pbox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pbox .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(10,20,30,.75);color:#fff;display:grid;place-items:center}
.pbox .x .ic{width:14px;height:14px}

/* refer */
.hero{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:11px}
.hero h2{font-size:20px;line-height:1.12;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85}
/* profile */
.avatar{width:46px;height:46px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:800 19px var(--font-display);flex:none}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-weight:600;font-size:12.5px;min-width:0}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.mini{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.mini .th{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:var(--chip);cursor:pointer}
.mini .th img{width:100%;height:100%;object-fit:cover}
.mini .th .tile .ic{width:24px;height:24px}.mini .th .tile span{display:none}
.mini h4{margin:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav.tabs .in2{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:12px;min-width:0}
nav.tabs a span{white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--primary)}
nav.tabs a[aria-current="page"] .ic{stroke-width:2.4}
nav.tabs a.plus .pb{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-12px;box-shadow:0 4px 12px rgba(242,165,22,.45)}
nav.tabs a.plus .ic{width:20px;height:20px;stroke-width:2.6}

/* sheet + toast */
.back{position:fixed;inset:0;background:rgba(8,14,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px}
.gal>div{flex:none;width:100%;aspect-ratio:16/10;scroll-snap-align:center;border-radius:16px;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.facts small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600;overflow-wrap:anywhere}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--primary)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 13px;border-radius:10px;font-weight:600;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* glass loader */
.loader{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;
  background:color-mix(in srgb,var(--bg) 58%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s}
.loader.show{opacity:1;visibility:visible}
.loader.boot{animation:bootOut .01s 6s forwards}
@keyframes bootOut{to{opacity:0;visibility:hidden}}
.blob{position:absolute;border-radius:50%;filter:blur(46px);animation:drift 3s ease-in-out infinite alternate}
.blob.a{width:110px;height:110px;background:var(--accent);opacity:.5;top:calc(50% - 85px);left:calc(50% - 95px)}
.blob.b{width:120px;height:120px;background:var(--primary);opacity:.4;top:calc(50% - 50px);left:calc(50% - 15px);animation-delay:-1.4s}
@keyframes drift{from{transform:translate(-14px,8px)}to{transform:translate(18px,-12px)}}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;height:84px;justify-content:flex-end}
.glass{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--glass-a),var(--glass-b));border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 8px 18px rgba(18,48,74,.25),inset 0 1px 1px rgba(255,255,255,.85),inset 0 -6px 10px rgba(255,255,255,.1);
  transform-origin:50% 100%;animation:jump .95s infinite}
.glass .ic{width:26px;height:26px;stroke:var(--primary);stroke-width:2;fill:var(--glass-fill)}
.gshadow{width:38px;height:6px;border-radius:50%;background:rgba(18,48,74,.4);filter:blur(3px);margin-top:6px;animation:shad .95s infinite}
@keyframes jump{
  0%{transform:translateY(0) scale(1.1,.88);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  20%{transform:translateY(-6px) scale(.98,1.04);animation-timing-function:ease-out}
  50%{transform:translateY(-26px) rotate(3deg) scale(.97,1.03);animation-timing-function:ease-in}
  80%{transform:translateY(-6px) scale(.99,1.02);animation-timing-function:cubic-bezier(.6,0,.9,.5)}
  100%{transform:translateY(0) scale(1.1,.88)}}
@keyframes shad{0%,100%{transform:scale(1.1,1);opacity:.9}50%{transform:scale(.55,.8);opacity:.35}}
.ldtxt{position:relative;display:flex;align-items:baseline;gap:2px;font-weight:700;font-size:12.5px;letter-spacing:.02em}
.dots{display:inline-flex;gap:3px;margin-left:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.25;animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.glass,.gshadow,.blob,.dots i{animation:none}.dots i{opacity:.7}}
/* auth, profile, support, skeleton */
.authw{padding:14px 0 8px;display:flex;flex-direction:column;gap:14px}
.authlogo{width:56px;height:56px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.authlogo .ic{width:28px;height:28px}
.authw h1{font-size:26px;letter-spacing:-.03em;line-height:1.1}
.pw{position:relative}.pw .in{padding-right:44px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.lnk{color:var(--primary);font-weight:700;text-decoration:none}
.center{text-align:center}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:32px}
.avwrap{position:relative;flex:none}
.camb{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:2px solid var(--bg);cursor:pointer}
.camb .ic{width:15px;height:15px}.camb{overflow:hidden}.camb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.avwrap.busy .avatar{opacity:.45}
.avwrap.busy::before{content:"";position:absolute;z-index:2;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.phead{display:flex;align-items:center;gap:16px;padding:6px 0 4px}
.phead h2{font-size:22px;overflow-wrap:anywhere}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mi:last-child{border:0}
.mic{width:36px;height:36px;border-radius:11px;background:var(--chip);color:var(--primary);display:grid;place-items:center;flex:none}
.mi small{display:block;color:var(--muted);font-size:12px}
.mi>.ic:last-child{color:var(--muted);width:16px;height:16px}
.sub{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.sub a{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;flex:none}
.sub h2{font-size:20px}
.btn.out{background:var(--danger-bg);color:var(--danger)}
.sk{border-radius:14px;height:236px;border:1px solid var(--line);background:linear-gradient(100deg,var(--chip) 30%,var(--surface) 50%,var(--chip) 70%);background-size:200% 100%;animation:shim 1.1s infinite}
@keyframes shim{to{background-position:-200% 0}}
.pill.wait{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--ink)}
.hero{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hero h2{font-size:20px;letter-spacing:-.02em}.hero p{margin:0;opacity:.85}
.supg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.supg a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:12px}
.supg a .ic{width:22px;height:22px;color:var(--primary)}
details.faq{border-bottom:1px solid var(--line);padding:10px 0}details.faq:last-child{border:0}
details.faq summary{font-weight:700;cursor:pointer}details.faq p{margin:6px 0 0;color:var(--muted)}
.ver{text-align:center;color:var(--muted);font-size:11.5px;padding:2px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.kpi b{display:block;font:800 22px var(--font-display)}.kpi span{font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sk,.avwrap.busy::before{animation:none}}
#maint{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--bg) 40%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6)}
#maint .mc{max-width:360px;width:100%;text-align:center;padding:0 22px 24px;border-radius:32px;background:linear-gradient(145deg,var(--glass-a),var(--glass-b));border:1px solid var(--glass-edge);box-shadow:0 22px 54px rgba(18,48,74,.3),inset 0 1px 1px rgba(255,255,255,.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:mIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mIn{from{opacity:0;transform:translateY(26px) scale(.93)}}
.mgear{width:88px;height:88px;margin:-44px auto 14px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#ffb340,#ff7a1a);color:#fff;box-shadow:0 14px 28px rgba(242,140,22,.5),inset 0 1px 1px rgba(255,255,255,.6)}
.mgear svg{width:46px;height:46px;animation:mspin 7s linear infinite}@keyframes mspin{to{transform:rotate(360deg)}}
#maint h2{font-size:23px;letter-spacing:-.02em;margin-bottom:8px}#maint p{margin:0 0 12px}
.mbar{height:6px;border-radius:9px;background:var(--chip);overflow:hidden;margin:16px 0}.mbar i{display:block;height:100%;width:38%;border-radius:9px;background:linear-gradient(90deg,var(--accent),#ff7a1a);animation:mbar 1.3s ease-in-out infinite alternate}@keyframes mbar{to{transform:translateX(165%)}}
</style>

function visible(){
  var a=all().filter(function(l){return !l.rented});
  if(F.type!=='Sab')a=a.filter(function(l){return l.type===F.type});
  if(F.q){var q=F.q.toLowerCase();a=a.filter(function(l){return (L(l.title)+' '+l.title.en+' '+l.locality+' '+locName(l.locality)+' '+L(l.address)+' '+t('ty_'+l.type)+' '+l.type).toLowerCase().indexOf(q)>-1})}
  if(F.max<MAXR)a=a.filter(function(l){return l.rent<=F.max});
  if(F.furn!=='Any')a=a.filter(function(l){return l.furnished===F.furn});
  if(F.tenant!=='Any')a=a.filter(function(l){return l.tenant===F.tenant||l.tenant==='Any'});
  if(F.loc)a=a.filter(function(l){return l.locality===F.loc});
  if(F.am.length)a=a.filter(function(l){return F.am.every(function(x){return l.amenities.indexOf(x)>-1})});
  a.sort(function(x,y){return F.sort==='low'?x.rent-y.rent:F.sort==='high'?y.rent-x.rent:y.created-x.created});
  return a;
}
function filterCount(){var n=0;if(F.max<MAXR)n++;if(F.furn!=='Any')n++;if(F.tenant!=='Any')n++;if(F.loc)n++;return n+F.am.length}

}
function card(l){
  var tags=[t('fu_'+l.furnished),t('te_'+l.tenant)].concat(l.amenities.slice(0,2).map(function(a){return t('am_'+a)}));

  '<span class="badge">'+((U&&l.ownerId===U.id)?esc(t('badge_mine')):ic('shield')+esc(t('badge_owner')))+'</span></div>'+
  '<div class="cb"><div class="row"><b class="price grow">'+rupee(l.rent)+'<small> '+esc(t('per_month'))+'</small></b><span class="pill">'+esc(t('ty_'+l.type))+'</span></div>'+
  '<h3>'+esc(L(l.title))+'</h3><p class="loc">'+ic('pin')+'<span>'+esc(locName(l.locality))+' · '+esc(ago(l.created))+'</span></p>'+
  '<div class="tags">'+tags.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</div></div></article>';
}

var VIEWS=['onb','home','add','profile','edit','rooms','saved','support','login','register','forgot'],AUTH=['login','register','forgot'];

var DUR={home:600,add:800,profile:900,edit:700,rooms:1000,saved:600,support:1100,login:900,register:1100,forgot:800}, loaderT;
function showLoader(ms,cb,key){
  var el=$('#loader');$('.ldtxt span',el).textContent=t(key||'loading');el.classList.add('show');clearTimeout(loaderT);
  loaderT=setTimeout(function(){try{if(cb)cb()}catch(err){showErr(err)}finally{el.classList.remove('boot');el.classList.remove('show')}},ms);
}
var curV='home';
function showErr(e){var m=String((e&&e.message)||e);try{var x=$('#toast');x.textContent='Error: '+m;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},9000)}catch(_){}}
addEventListener('error',function(ev){showErr(ev.error||ev.message)});
addEventListener('unhandledrejection',function(ev){showErr(ev.reason)});
function cur(){return VIEWS.indexOf(curV)<0?'home':curV}
function resolve(h){if(U&&U.onb===false)return 'onb';if(U&&h==='onb')return 'home';if(!U&&AUTH.indexOf(h)<0)return 'register';if(U&&AUTH.indexOf(h)>-1)return 'home';return h}
function go(h){curV=h;route()}
function navTo(h){if(VIEWS.indexOf(h)<0)return;if(h===curV&&resolve(h)===h){window.scrollTo(0,0);return}curV=h;showLoader(DUR[resolve(h)]||600,route)}
function route(){
  var h=resolve(cur());
  curV=h;
  VIEWS.forEach(function(v){$('#v-'+v).hidden=v!==h});
  $('nav.tabs').hidden=AUTH.indexOf(h)>-1||h==='onb'
  $$('nav.tabs a').forEach(function(a){if(a.getAttribute('data-v')===TABV[h])a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  closeSheet();window.scrollTo(0,0);
  try{
  if(h==='home'){renderList();setArea()}if(h==='onb'){if(!obOn){obI=0;obA={};obOn=1}obRender()}else obOn=0;if(h==='add')prefillForm();if(h==='profile')renderProfile();
  if(h==='edit'){['pn','pp','pa','pe'].forEach(function(i){$('#'+i).value=''});renderEdit()}
  if(h==='rooms')renderRooms();if(h==='saved')renderSaved();if(h==='support')renderSupport();
  }catch(err){showErr(err)}
}

  var rb='',rv=($('#rRef').value||'').trim().toUpperCase();if(rv){var rf0=users.filter(function(x){return x.code===rv})[0];if(!rf0){er.textContent=gx('Invalid referral code','रेफरल कोड गलत है');return}rb=rf0.id}
  hashPw(pw).then(function(h){showLoader(2000,function(){
    var u={id:'u'+Date.now(),name:n,phone:p,email:m,pass:h,area:'',photo:'',saved:[],onb:false,gender:'',role:'',who:'',code:genCode(),refBy:rb,created:Date.now()};
    users.push(u);saveUsers();sid=u.id;store.set('sid',sid);loadSession();resetF($('#regForm'));toast(t('reg_ok'));go('home');
  },'ld_reg')});
});
onSubmit('#fg1',function(e){
  e.preventDefault();var v=$('#fId').value.trim(),er=$('#f1Err');er.textContent='';
  if(!v){er.textContent=t('err_id');return}var u=findIdent(v);if(!u){er.textContent=t('err_nouser');return}
  showLoader(1200,function(){fgUser=u.id;fgOtp=String(1000+Math.floor(Math.random()*9000));$('#otpNote').textContent=t('otp_sent',{o:fgOtp});$('#fg1').hidden=true;$('#fg2').hidden=false},'ld_otp');
});
onSubmit('#fg2',function(e){
  e.preventDefault();var er=$('#f2Err');er.textContent='';
  if($('#fOtp').value.trim()!==fgOtp){er.textContent=t('err_otp');return}
  var pw=$('#fPw').value,pe=pwErr(pw,$('#fPw2').value);if(pe){er.textContent=t(pe);return}
  hashPw(pw).then(function(h){showLoader(1500,function(){var u=findU(fgUser);if(u){u.pass=h;saveUsers()}fgUser=fgOtp=null;resetF($('#fg2'));$('#fg2').hidden=true;resetF($('#fg1'));$('#fg1').hidden=false;toast(t('pass_reset_ok'));go('login')},'ld_reset')});
});
$('#logoutBtn').addEventListener('click',function(){
  var el=openSheet('<div class="stack" style="padding-top:6px"><h2 style="font-size:20px">'+esc(t('logout_t'))+'</h2><p class="muted" style="margin:0">'+esc(t('logout_s'))+'</p><div class="two"><button class="btn alt" id="lgNo" type="button">'+esc(t('cancel'))+'</button><button class="btn out" id="lgYes" type="button">'+esc(t('logout'))+'</button></div></div>',t('logout_t'));
  $('#lgNo',el).addEventListener('click',closeSheet);
  $('#lgYes',el).addEventListener('click',function(){closeSheet();showLoader(1000,function(){sid=null;store.set('sid',null);U=null;saved=[];toast(t('logout'));go('register')},'ld_out')});
});

/* profile edit */
$('#eAv').addEventListener('click',function(e){if(e.target.closest('#rmPhoto')){U.photo='';saveUsers();renderProfile();renderEdit();toast(t('photo_removed'))}});
$('#pSave').addEventListener('click',function(){
  var n=$('#pn').value.trim(),p=$('#pp').value.replace(/\D/g,'').slice(-10),m=$('#pe').value.trim(),a=$('#pa').value.trim(),er=$('#eErr');er.textContent='';
  if(!n){er.textContent=t('err_name');return}if(!PH.test(p)){er.textContent=t('err_phone');return}if(m&&!EM.test(m)){er.textContent=t('err_email');return}
  var o=findIdent(p);if(o&&o.id!==U.id){er.textContent=t('err_exists');return}
  showLoader(900,function(){U.name=n;U.phone=p;U.email=m;U.area=a;U.gender=$('#pg').value;U.role=$('#pr').value;U.who=$('#pwho').value;saveUsers();okModal()},'ld_save');
});
$('#cSave').addEventListener('click',function(){
  var er=$('#cErr');er.textContent='';var pe=pwErr($('#cp1').value,$('#cp2').value);if(pe){er.textContent=t(pe);return}
  hashPw($('#cp0').value).then(function(h0){if(h0!==U.pass){er.textContent=t('err_cur');return}
    hashPw($('#cp1').value).then(function(h){showLoader(1300,function(){U.pass=h;saveUsers();['cp0','cp1','cp2'].forEach(function(i){$('#'+i).value=''});toast(t('pass_changed'))},'ld_save')})});
});

/* my rooms + saved lists */
$('#rFilter').addEventListener('click',function(e){var b=e.target.closest('[data-rf]');if(b){rf=b.getAttribute('data-rf');renderRooms()}});
function listClick(e){
  var o=e.target.closest('[data-open]');if(o){open2(o.getAttribute('data-open'));return}
  var u=e.target.closest('[data-unsave]');if(u){toggleSave(u.getAttribute('data-unsave'));return}
  var gb=e.target.closest('[data-geo]');if(gb){var gl=rooms.filter(function(x){return x.id===gb.getAttribute('data-geo')})[0];if(gl)getGeo(function(g){gl.geo=g;saveRooms();renderRooms();toast(gx('Location updated','लोकेशन अपडेट हो गई'))});return}
  var r=e.target.closest('[data-rent]');if(r){var l=rooms.filter(function(x){return x.id===r.getAttribute('data-rent')})[0];if(l)showLoader(600,function(){l.rented=!l.rented;saveRooms();renderRooms();renderList();toast(l.rented?t('l_rented'):t('l_live'))});return}
  var d=e.target.closest('[data-del]');if(d){var id=d.getAttribute('data-del');
    if(armed===id){showLoader(700,function(){rooms=rooms.filter(function(x){return x.id!==id});saved=saved.filter(function(x){return x!==id});saveRooms();persistSaved();armed=null;renderRooms();renderList();toast(t('l_deleted'))})}
    else{armed=id;d.textContent=t('delete_confirm');clearTimeout(armT);armT=setTimeout(function(){armed=null;renderRooms()},3000)}}
}
$('#rList').addEventListener('click',listClick);$('#sList').addEventListener('click',listClick);
$('#themeSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;theme=b.getAttribute('data-t');store.set('theme',theme);applyTheme();renderProfile()});

if(settings.support)SUPPORT=settings.support;

loadSession();applyTheme();applyI18n();applyMaint();renderChips();renderForm();setArea();tick();route();

function remoteSync(){var had=U&&U.id;users=store.get('users',[]);rooms=store.get('rooms',[]);settings=store.get('settings',settings);if(settings.support)SUPPORT=settings.support;loadSession();applyMaint();applyBrand();if(!store.get('theme',null)){theme=(settings.theme&&settings.theme.mode)||'light';applyTheme()}
  if(had&&!U){toast(t('err_blocked'));go('login');return}

})();
